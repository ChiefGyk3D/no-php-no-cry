version: 2
updates:
  # GitHub Actions, plus the one lockfile that pins Wrangler for the deploy job.
  # The site itself has no package manager. Hugo is pinned in .hugo-version and
  # bumped by hand.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /deploy
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
