# CI for no-php-no-cry. The Hugo build, the output checks, the test scripts, the size budget and the browser
# gate are one call to the shared parallel-ci workflow in ChiefGyk3D/git-your-ship-together (GYST): one build,
# then the checks side by side, each on the build. Shell lint and security scans are the other shared
# workflows. `CI green` is the single required check; it stays a job of this file because a called workflow's
# check run is named `<caller job> / <job>` and branch protection and deploy.yml name `CI green` exactly.
# The old step to new job table is in docs/ci-parallel.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, Monday 06:00 UTC, so new advisories surface between commits
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/parallel-ci.yml@01f397834f7acc553593abefbba135b18f580730 # v1.34.0
    permissions:
      contents: read
    with:
      # Pinned, checksum verified Hugo. The tarball goes to hugo-dl (cacheable once egress is block), the
      # binary to hugo; PATH is set in this shell only, nothing is written to GITHUB_PATH.
      setup-command: |
        version="$(tr -d '[:space:]' < .hugo-version)"
        base="https://github.com/gohugoio/hugo/releases/download/v${version}"
        tarball="hugo_${version}_linux-amd64.tar.gz"
        mkdir -p "$RUNNER_TEMP/hugo-dl" "$RUNNER_TEMP/hugo"
        (
          cd "$RUNNER_TEMP/hugo-dl"
          [ -f "$tarball" ] || curl -fsSL --retry 3 -O "${base}/${tarball}"
          curl -fsSL --retry 3 -O "${base}/hugo_${version}_checksums.txt"
          grep " ${tarball}\$" "hugo_${version}_checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" -C "$RUNNER_TEMP/hugo" hugo
        )
        export PATH="$RUNNER_TEMP/hugo:$PATH"
      # Production build, then the staging variant (params.environment = staging: noindex on every page,
      # robots.txt disallows all), built outside the repository and shared as the second output.
      build-command: |
        scripts/check-hugo-version.sh "$(tr -d '[:space:]' < .hugo-version)"
        hugo --minify --gc
        HUGO_PARAMS_ENVIRONMENT=staging hugo --minify --gc --destination "$RUNNER_TEMP/public-staging"
      build-output-path: public
      extra-output-path: RUNNER_TEMP/public-staging
      build-timeout-minutes: 15
      cache-tool-path: RUNNER_TEMP/hugo-dl
      cache-tool-key-files: '[".hugo-version"]'
      cache-pip-files: '["scripts/requirements-qr.txt", "scripts/requirements-qr-decode.txt", "tools/wxr2hugo/requirements-webp.txt"]'
      # audit, not block: the allow-list for these jobs has not been measured yet (the old build job was audit
      # for the same reason). Switch to block with the endpoints from the first run's report; block also
      # turns the Hugo tarball and pip caches on.
      egress-policy-secretless: audit
      # Only a change confined to these files leaves the size budget and the browser gate out. Every other
      # path (content, layouts, assets, static, scripts, hugo.toml, .github, anything unlisted) is `site`.
      # A push, a schedule, a manual run, a pull request to another branch and any diff problem run all.
      areas: '{"docs": ["docs/*.md", "docs/wiki/*.md", "README.md", "CONTRIBUTING.md", "CODE_OF_CONDUCT.md"], "site": ["*"]}'
      jobs: |
        [
            {"name": "output checks", "command": "EXPECT_ENV=production scripts/check-output.sh public\nscripts/check-site-artifact.sh public\nEXPECT_ENV=staging scripts/check-output.sh \"$RUNNER_TEMP/public-staging\"\nscripts/check-site-artifact.sh \"$RUNNER_TEMP/public-staging\"\nscripts/test-check-site-artifact.sh", "timeout": 10},
            {"name": "output checker tests", "command": "scripts/test-check-output.sh", "timeout": 20},
            {"name": "site tests", "command": "scripts/test-head.sh\nscripts/test-featured-image.sh\nscripts/test-social-products.sh\nscripts/test-share.sh\nscripts/test-borders.sh\nscripts/test-resume.sh\nscripts/test-layout.sh\nscripts/test-pages.sh\nscripts/test-titles.sh\nscripts/test-about-email.sh\nscripts/test-social-identity.sh\nscripts/test-contact-page.sh\nscripts/test-comments.sh\nscripts/test-redirects.sh\nscripts/test-llms.sh\nscripts/test-migration.sh\nscripts/test-archetype.sh\nscripts/test-check-wiki.sh\nscripts/test-publish-wiki.sh", "timeout": 20, "tools": true, "build": false},
            {"name": "tool tests", "command": "scripts/test-deploy-sparse.sh\nscripts/test-deploy-doppler-vars.sh\nscripts/test-pin-script.sh\nscripts/test-check-hugo-version.sh\nscripts/test-check-reach-around-drift.sh\nscripts/test-smoke-site.sh\nscripts/test-verify-live.sh\nscripts/test-robots-wildcard.sh\nscripts/test-wait-for-ci-green.sh\nscripts/test-ensure-pages-project.sh\nscripts/test-wxr2hugo.sh\nscripts/test-wxr2hugo-webp.sh\nscripts/test-analytics.sh\nscripts/test-brand.sh\nscripts/test-gitleaks-config.sh\nscripts/test-crosscheck-redirects.sh\nscripts/test-scrub-config.sh", "timeout": 20, "tools": true, "build": false, "pip-cache": true},
            {"name": "content checks", "command": "scripts/gen-support-qr.sh --check --decode\nscripts/check-wording.sh\nscripts/test-check-wording.sh\npython3 -I scripts/check-workflow-secrets.py\nscripts/test-check-workflow-secrets.sh\npython3 -I scripts/check-threat-model.py\nscripts/test-check-threat-model.sh\n# the job checks out one commit; the changed-file diff needs its first parent\ngit fetch --no-tags --deepen=1 origin\npython3 -I scripts/check-content.py\nscripts/test-check-content.sh\nscripts/test-author.sh\nscripts/check-license.sh\nscripts/test-check-license.sh\npython3 -I scripts/check-wiki.py\nscripts/test-check-launch-seo.sh\npython3 -I scripts/gen-tokens.py --check\npython3 -I scripts/check-contrast.py assets/css/tokens.css\nscripts/test-check-contrast.sh\nscripts/check-brand-assets.sh", "timeout": 15, "build": false, "pip-cache": true},
            {"name": "size budget", "command": "python3 -I scripts/check-budget.py public\nscripts/test-check-budget.sh", "timeout": 10, "areas": ["site"]},
            {"name": "browser gate", "command": "google-chrome --version\npython3 -I scripts/browser-gate.py public\nscripts/test-browser-gate.sh", "timeout": 20, "areas": ["site"]}
        ]

  shell:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/bash-ci.yml@01f397834f7acc553593abefbba135b18f580730 # v1.34.0
    permissions:
      contents: read
    with:
      test-command: ./scripts/test-check-output.sh && ./scripts/test-check-hugo-version.sh   # needs no Hugo; the ci job also runs both against the real build
      egress-policy: block
      timeout-minutes: 20   # ~330 serial cases at ~2 s each; measured 6 to 10 minutes on hosted runners

  security:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/security.yml@01f397834f7acc553593abefbba135b18f580730 # v1.34.0
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      id-token: write   # declared by the called workflow's snyk and scorecard jobs; checked statically
    with:
      codeql-languages: actions   # no Python or other CodeQL language in this repository
      pip-audit-requirements: ""  # no Python dependencies; the empty string skips the job
      egress-policy: block

  ci-green:
    name: CI green
    if: always()
    needs: [ci, shell, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          bad="$(echo "$RESULTS" | python3 -c '
          import json, sys
          needs = json.load(sys.stdin)
          print(" ".join(k for k, v in needs.items() if v["result"] != "success"))
          ')"
          if [ -n "$bad" ]; then
            echo "not green: $bad"
            exit 1
          fi
