# CI for no-php-no-cry. Shell lint and security scans are the shared workflows in
# ChiefGyk3D/git-your-ship-together; GYST has no Hugo workflow yet, so the
# `build` job here is repo-local. `CI green` is the single required check.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, Monday 06:00 UTC, so new advisories surface between commits
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Hugo build and output checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          # audit, not block: the allow-list for this job has not been measured
          # yet. Switch to block with the endpoints from the first run's report.
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Hugo (pinned, checksum verified)
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .hugo-version)"
          base="https://github.com/gohugoio/hugo/releases/download/v${version}"
          tarball="hugo_${version}_linux-amd64.tar.gz"
          mkdir -p "$RUNNER_TEMP/hugo"
          cd "$RUNNER_TEMP/hugo"
          curl -fsSL --retry 3 -O "${base}/${tarball}"
          curl -fsSL --retry 3 -O "${base}/hugo_${version}_checksums.txt"
          grep " ${tarball}\$" "hugo_${version}_checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" hugo
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"

      - name: Hugo is the pinned standard edition
        run: scripts/check-hugo-version.sh "$(tr -d '[:space:]' < .hugo-version)"

      - name: Build
        run: hugo --minify --gc

      - name: Check the generated output (production)
        env:
          EXPECT_ENV: production
        run: scripts/check-output.sh public

      - name: Check the site for Pages control files and pinned _headers/_redirects
        run: scripts/check-site-artifact.sh public

      # The staging variant: same site, params.environment = staging (noindex on
      # every page, robots.txt disallows all). Built outside the repository.
      - name: Build the staging variant
        env:
          HUGO_PARAMS_ENVIRONMENT: staging
        run: hugo --minify --gc --destination "$RUNNER_TEMP/public-staging"

      - name: Check the generated output (staging)
        env:
          EXPECT_ENV: staging
        run: scripts/check-output.sh "$RUNNER_TEMP/public-staging"

      - name: Check the staging site for Pages control files and pinned _headers/_redirects
        run: scripts/check-site-artifact.sh "$RUNNER_TEMP/public-staging"

      - name: Test the output checker (negative cases)
        run: scripts/test-check-output.sh

      - name: Test the page head and footer links (hostile front matter)
        run: scripts/test-head.sh

      - name: Test the site artifact checker (negative cases)
        run: scripts/test-check-site-artifact.sh

      - name: Test the theme script pinning
        run: scripts/test-pin-theme.sh

      - name: Test the Hugo version check
        run: scripts/test-check-hugo-version.sh

      - name: Test the post-deploy smoke check (local fake server)
        run: scripts/test-smoke-site.sh

      - name: Test the deploy gate wait (stubbed gh, no network)
        run: scripts/test-wait-for-ci-green.sh

      - name: Test the Pages project check (local fake API)
        run: scripts/test-ensure-pages-project.sh

      - name: Test the WordPress converter
        run: scripts/test-wxr2hugo.sh

      - name: Check design-token contrast (WCAG AA)
        run: python3 -I scripts/check-contrast.py assets/css/tokens.css

      - name: Check the brand asset manifest
        run: scripts/check-brand-assets.sh

      - name: Test the brand checks (negative cases)
        run: scripts/test-brand.sh

  shell:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/bash-ci.yml@6f40107c2e05483f485452991e422f7f63886000 # v1.25.1
    permissions:
      contents: read
    with:
      test-command: ./scripts/test-check-output.sh && ./scripts/test-check-hugo-version.sh   # needs no Hugo; the build job also runs it against the real build
      egress-policy: block

  security:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/security.yml@6f40107c2e05483f485452991e422f7f63886000 # v1.25.1
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      id-token: write   # declared by the called workflow's snyk and scorecard jobs; checked statically
    with:
      codeql-languages: actions   # no Python or other CodeQL language in this repository
      pip-audit-requirements: ""  # no Python dependencies; the empty string skips the job
      egress-policy: block

  ci-green:
    name: CI green
    if: always()
    needs: [build, shell, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          bad="$(echo "$RESULTS" | python3 -c '
          import json, sys
          needs = json.load(sys.stdin)
          print(" ".join(k for k, v in needs.items() if v["result"] != "success"))
          ')"
          if [ -n "$bad" ]; then
            echo "not green: $bad"
            exit 1
          fi
