# CI for no-php-no-cry. Shell lint and security scans are the shared workflows in
# ChiefGyk3D/git-your-ship-together; GYST has no Hugo workflow yet, so the
# `build` job here is repo-local. `CI green` is the single required check.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, Monday 06:00 UTC, so new advisories surface between commits
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Hugo build and output checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          # audit, not block: the allow-list for this job has not been measured
          # yet. Switch to block with the endpoints from the first run's report.
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Hugo (pinned, checksum verified)
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .hugo-version)"
          base="https://github.com/gohugoio/hugo/releases/download/v${version}"
          tarball="hugo_${version}_linux-amd64.tar.gz"
          mkdir -p "$RUNNER_TEMP/hugo"
          cd "$RUNNER_TEMP/hugo"
          curl -fsSL --retry 3 -O "${base}/${tarball}"
          curl -fsSL --retry 3 -O "${base}/hugo_${version}_checksums.txt"
          grep " ${tarball}\$" "hugo_${version}_checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" hugo
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"

      - name: Hugo is the pinned standard edition
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .hugo-version)"
          out="$(hugo version)"
          echo "$out"
          case "$out" in
            "hugo v${version}-"*) ;;
            *) echo "unexpected Hugo version"; exit 1 ;;
          esac
          case "$out" in
            *extended*) echo "extended edition is not allowed"; exit 1 ;;
            *) ;;
          esac

      - name: Build
        run: hugo --minify --gc

      - name: Check the generated output
        run: scripts/check-output.sh public

      - name: Test the output checker (negative cases)
        run: scripts/test-check-output.sh

  shell:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/bash-ci.yml@e5c6ec3251cf3a6eea100a1c21736f1818d5efc7 # v1.23.0
    permissions:
      contents: read
    with:
      test-command: ./scripts/test-check-output.sh   # needs no Hugo; the build job also runs it against the real build
      egress-policy: block

  security:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/security.yml@e5c6ec3251cf3a6eea100a1c21736f1818d5efc7 # v1.23.0
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      id-token: write   # declared by the called workflow's snyk and scorecard jobs; checked statically
    with:
      codeql-languages: actions   # no Python or other CodeQL language in this repository
      pip-audit-requirements: ""  # no Python dependencies; the empty string skips the job
      egress-policy: block

  ci-green:
    name: CI green
    if: always()
    needs: [build, shell, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          bad="$(echo "$RESULTS" | python3 -c '
          import json, sys
          needs = json.load(sys.stdin)
          print(" ".join(k for k, v in needs.items() if v["result"] != "success"))
          ')"
          if [ -n "$bad" ]; then
            echo "not green: $bad"
            exit 1
          fi
