# Monthly ASN list refresh for issue #293. This workflow generates a reviewed
# data-only change and never merges it. PR creation is deliberately disabled
# until the owner sets ASN_REFRESH_PR_ENABLED=true and replaces the empty
# ASN_REFRESH_APP_TOKEN below with an ephemeral GitHub App installation token
# supplied by an approved secret-manager integration. Never use a PAT, and do
# not put a secret-manager value in a GitHub Actions secret.
name: Refresh analytics ASNs

on:
  schedule:
    # Monthly, first day at 08:17 UTC, off the hour on purpose.
    - cron: '17 8 1 * *'
  workflow_dispatch:
    inputs:
      allow_large_change:
        description: Allow more than 20 percent change for a reviewed first import
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Generate ASN refresh
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
            raw.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch source lists and resolve X4BNet commit
        run: scripts/fetch-asn-sources.sh "$RUNNER_TEMP/asn-sources"

      - name: Generate list and review report
        env:
          ALLOW_LARGE_CHANGE: ${{ inputs.allow_large_change || false }}
        run: |
          set -euo pipefail
          args=(
              --vpn "$RUNNER_TEMP/asn-sources/vpn.txt"
              --datacenter "$RUNNER_TEMP/asn-sources/datacenter.txt"
              --ipverse "$RUNNER_TEMP/asn-sources/ipverse-as.json"
              --out analytics/hosting-asns.mjs
              --report "$RUNNER_TEMP/asn-report.md"
              --source-sha "$(<"$RUNNER_TEMP/asn-sources/source-sha")"
          )
          if [[ "$ALLOW_LARGE_CHANGE" == true ]]; then
              args+=(--allow-large-change)
          fi
          node analytics/refresh-asns.mjs "${args[@]}"

      # OWNER SETUP REQUIRED: replace this empty value with an ephemeral token
      # delivered by the chosen GitHub App and secret manager. Keep the gate.
      - name: Open owner-review pull request
        if: vars.ASN_REFRESH_PR_ENABLED == 'true'
        env:
          ASN_REFRESH_APP_TOKEN: ""
          SOURCE_SHA_FILE: ${{ runner.temp }}/asn-sources/source-sha
          REPORT_FILE: ${{ runner.temp }}/asn-report.md
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ -z "$ASN_REFRESH_APP_TOKEN" ]]; then
              echo "::error title=Owner setup required::Configure an ephemeral GitHub App installation token as documented in this workflow and docs/analytics-deploy.md."
              exit 1
          fi
          export GH_TOKEN="$ASN_REFRESH_APP_TOKEN"
          source_sha="$(<"$SOURCE_SHA_FILE")"
          branch="automation/refresh-asns-${source_sha:0:12}"
          git config user.name "no-php-no-cry ASN refresh"
          git config user.email "asn-refresh@users.noreply.github.com"
          git checkout -b "$branch"
          git add analytics/hosting-asns.mjs
          git commit -m "chore: refresh analytics ASN classes"
          gh auth setup-git
          git push --force-with-lease origin "$branch"
          gh pr create \
              --base "$DEFAULT_BRANCH" \
              --head "$branch" \
              --title "chore: refresh analytics ASN classes" \
              --body-file "$REPORT_FILE"
