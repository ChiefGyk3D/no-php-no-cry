# Deploy to Cloudflare Pages. Runs on a push to the default branch or by hand;
# never on a pull request, and it is not part of the `CI green` gate. Setup and
# the two secret paths (Doppler, or plain GitHub Actions secrets) are in
# docs/deploy.md.
#
# Four jobs, each with only the permissions it needs:
#   build   builds and checks the site, uploads the public directory.
#   gate    waits for the `CI green` check run (ci.yml) on this commit and
#           fails unless it succeeds. Reads checks; holds no secret.
#   deploy  the only job that holds credentials. Repository code is limited to
#           two scripts (see the checkout step): the artifact check before the
#           credentials load, the project check after. It downloads the build
#           artifact and runs a pinned Wrangler on it.
#           Needs build and gate.
#   smoke   checks the live site. No credentials.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          # audit, not block: artifact upload goes to GitHub's blob storage,
          # whose host name varies per run and cannot be listed without a
          # wildcard (unsupported), so no allow-list can be measured here.
          # Tighten with the first run's report: issue #10.
          # Expected so far: github.com:443 api.github.com:443
          # release-assets.githubusercontent.com:443 objects.githubusercontent.com:443
          # results-receiver.actions.githubusercontent.com:443
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Hugo (pinned, checksum verified)
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .hugo-version)"
          base="https://github.com/gohugoio/hugo/releases/download/v${version}"
          tarball="hugo_${version}_linux-amd64.tar.gz"
          mkdir -p "$RUNNER_TEMP/hugo"
          cd "$RUNNER_TEMP/hugo"
          curl -fsSL --retry 3 -O "${base}/${tarball}"
          curl -fsSL --retry 3 -O "${base}/hugo_${version}_checksums.txt"
          grep " ${tarball}\$" "hugo_${version}_checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" hugo
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"

      - name: Hugo is the pinned standard edition
        run: scripts/check-hugo-version.sh "$(tr -d '[:space:]' < .hugo-version)"

      # test-blog is the staging site: noindex on every page and a robots.txt
      # that disallows everything. At the apex cutover set this to production
      # (docs/cutover.md).
      - name: Build
        env:
          HUGO_PARAMS_ENVIRONMENT: staging
        run: hugo --minify --gc

      - name: Check the generated output
        env:
          EXPECT_ENV: staging
        run: scripts/check-output.sh public

      - name: Check the site for Pages control files and pinned _headers/_redirects
        run: scripts/check-site-artifact.sh public

      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: public
          if-no-files-found: error
          retention-days: 7

  # Deploy only a commit CI has passed. ci.yml runs on every push to main (and
  # on a manual run), so a `CI green` check run exists for the SHA this
  # workflow runs on. A push trigger, not workflow_run, so no code from an
  # untrusted branch is ever checked out here. Skipped (so deploy is skipped)
  # in the same cases as deploy, to avoid waiting for a SHA that never deploys.
  gate:
    name: CI green on this commit
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      checks: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          # audit: this job holds no secret and its output is only a pass or
          # fail; the deploy job is the one that blocks.
          egress-policy: audit

      - name: Check out the wait script only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/wait-for-ci-green.sh
          sparse-checkout-cone-mode: false

      # WAIT_TIMEOUT_SECONDS (default 1500) and POLL_INTERVAL_SECONDS (default
      # 20) can be overridden here.
      - name: Wait for CI green
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: scripts/wait-for-ci-green.sh "$REPO" "$SHA"

  deploy:
    name: Deploy to Cloudflare Pages
    needs: [build, gate]
    # Default branch only; a manual run from another branch builds but stops here.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Doppler OIDC; the only job that holds it
    env:
      WRANGLER_SEND_METRICS: "false"
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'no-php-no-cry' }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          # block, with an explicit list (no wildcards). The runner's own
          # infrastructure hosts are allowed by the agent. This list is
          # UNMEASURED: it comes from what each step is known to reach. If a
          # host is missing, the first run blocks that connection and the log
          # names the host. That is a safe failure: nothing was sent. Add the
          # host here and see docs/deploy.md (Egress hardening), then re-run.
          # The build job stays in audit: it uploads to a blob host whose name
          # varies per run.
          egress-policy: block
          allowed-endpoints: >-
            api.cloudflare.com:443
            api.doppler.com:443
            api.github.com:443
            github.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443

      # Egress canary, as in git-your-ship-together (EX-0001): a runner with
      # broken DNS makes block mode fail confusingly, so say which it is first.
      - name: Egress canary
        timeout-minutes: 2
        run: |
          set -u
          bad=""
          for name in github.com api.github.com api.cloudflare.com; do
            if ! timeout 8 bash -c "exec 3<>/dev/tcp/${name}/443" 2>/dev/null; then
              bad="$bad $name"
            fi
          done
          if [ -n "$bad" ]; then
            echo "::error title=egress canary::cannot reach:${bad}. Either the runner network is broken (rerun the job) or the allow-list is wrong (docs/deploy.md)."
            exit 1
          fi
          echo "egress canary: allowed hosts accept TCP 443"

      # Checked out: deploy/ (a package.json and its lockfile), static/_headers
      # (the expected headers file), theme.js.sha256 (the pinned theme script
      # hash), the shared rules file and two scripts. scripts/test-deploy-sparse.sh
      # fails CI if a file these scripts need is missing from this list. Repository code that runs
      # BEFORE the credentials load: check-site-artifact.sh (reads the
      # downloaded build and static/_headers, no network). Repository code that
      # runs AFTER they load: ensure-pages-project.sh only (two curl calls,
      # token and other inputs validated first, no package loaded). Everything
      # installs before any secret exists, from the lockfile with install
      # scripts off, so a package never sees the token.
      - name: Check out the Wrangler lockfile and the project check
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            /deploy/
            /static/_headers
            /theme.js.sha256
            /scripts/artifact-rules.sh
            /scripts/check-site-artifact.sh
            /scripts/ensure-pages-project.sh
          sparse-checkout-cone-mode: false

      - name: Set up Node.js (Wrangler needs 22 or newer)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install Wrangler (lockfile, no install scripts)
        working-directory: deploy
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node_modules/.bin/wrangler --version

      # After the checkout above: actions/checkout cleans the workspace, so a
      # build downloaded before it is deleted and `wrangler pages deploy site`
      # fails with ENOENT. Still before any secret exists.
      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site

      - name: Check the build is present
        run: |
          set -euo pipefail
          test -f site/index.html || { echo "::error title=Deploy::site/index.html is missing: the build artifact was not downloaded or was cleaned"; exit 1; }
          echo "build present: $(find site -type f | wc -l) files"

      # Before any credential exists: nothing Pages would run (worker, routes,
      # functions) and no _headers/_redirects other than the expected ones.
      - name: Check the build for Pages control files
        run: scripts/check-site-artifact.sh site static/_headers

      - name: Fetch Cloudflare credentials from Doppler
        uses: ChiefGyk3D/git-your-ship-together/.github/actions/doppler-secrets@f344c638e1316d43514a41e4a22f172583c271fc # v1.26.0
        with:
          project: cloudflare
          config: prd
          identity-id: ${{ vars.DOPPLER_CLOUDFLARE_IDENTITY_ID }}
          token: ${{ secrets.DOPPLER_CLOUDFLARE_TOKEN }}

      # Doppler exports the two names when it is configured. Otherwise the same
      # names come from GitHub Actions secrets. Neither: fail, never skip.
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error title=Deploy::missing:${missing}. Neither Doppler (project cloudflare, config prd) nor GitHub Actions secrets supplied it. See docs/deploy.md."
            exit 1
          fi
          echo "Cloudflare credentials present (values not shown)."

      # The token has Account > Cloudflare Pages > Edit, which includes creating
      # a project. Idempotent: an existing project is left alone.
      - name: Ensure the Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRODUCTION_BRANCH: ${{ github.event.repository.default_branch }}
        run: scripts/ensure-pages-project.sh

      - name: Publish with Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.event.repository.default_branch }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          deploy/node_modules/.bin/wrangler pages deploy site \
            --project-name "$CLOUDFLARE_PAGES_PROJECT" \
            --branch "$BRANCH" \
            --commit-hash "$COMMIT_SHA" \
            --commit-message "Deploy ${COMMIT_SHA}"

  smoke:
    name: Smoke test the live site
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://test-blog.chiefgyk3d.com' }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          # audit, not block: unmeasured (artifact host, and the site host
          # depends on SITE_URL). Tighten after the first run: issue #10.
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site

      - name: Smoke test
        run: scripts/smoke-site.sh "$SITE_URL" site
