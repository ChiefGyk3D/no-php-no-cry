baseURL = "https://test-blog.chiefgyk3d.com/"
locale = "en-us"   # Hugo >= 0.158 name for languageCode
title = "ChiefGyk3D"

# Kinds this site does not use. The taxonomy index (/tags/, /categories/) is
# not linked anywhere; term pages (one tag, one category) are used.
# robots.txt comes from layouts/home.robots.txt (named for its output format: a bare layouts/robots.txt loses to layouts/home.llms.txt) and depends on params.environment.
disableKinds = ["taxonomy"]

# The site's own pages load nothing from a third party and embed nothing. Cloudflare Web Analytics is turned on at the host (see content/privacy/index.md).
disableHugoGeneratorInject = true
enableGitInfo = false
timeZone = "America/New_York"

[taxonomies]
  category = "categories"
  tag = "tags"

# Home, posts and journal publish a feed. Home also publishes the site feed at
# /feed/index.xml (see [outputFormats.feed]), _redirects and
# robots.txt.
[outputs]
  home = ["html", "rss", "feed", "redirects", "robots", "llms"]
  section = ["html", "rss"]
  page = ["html"]
  term = ["html"]

# Cloudflare Pages redirects file, built from every page's front-matter
# aliases (layouts/home.redirects). A file named _redirects has no extension.
[mediaTypes."text/x-cloudflare-redirects"]
  suffixes = [""]
  delimiter = ""

[outputFormats.redirects]
  mediaType = "text/x-cloudflare-redirects"
  baseName = "_redirects"
  isPlainText = true
  notAlternative = true

# The site feed. WordPress served its RSS at /feed/; the same feed is published
# as the real file feed/index.xml, and layouts/home.redirects sends the old
# feed addresses (/feed/, /feed/atom/, /comments/feed/) to it. Cloudflare Pages
# has no directory index for XML, and the artifact check pins _headers to one
# /* block and _redirects to 301/302 lines, so /feed/ itself is a redirect.
[outputFormats.feed]
  mediaType = "application/rss+xml"
  baseName = "index"
  path = "feed"
  rel = "alternate"

# /llms.txt, the llms.txt convention (https://llmstxt.org): a Markdown summary
# of the site for language-model readers. layouts/home.llms.txt builds it from
# the sections' own front matter and data/*.yaml, so it follows the site.
# scripts/check-output.sh requires it and checks its shape.
[outputFormats.llms]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true

[minify]
  minifyOutput = true
  [minify.tdewolff.html]
    keepComments = true

[markup.goldmark.renderer]
  # Content is the owner's own; raw HTML in Markdown stays off until needed.
  unsafe = false

[markup.highlight]
  # Class-based output: inline style= attributes are blocked by the CSP
  # (style-src 'self') and rejected by scripts/check-output.sh. The colors live
  # in assets/css/highlight.css, on the brand tokens.
  noClasses = false
  guessSyntax = false

[params]
  description = "Hands-on cybersecurity, Linux, homelabs, and open-source projects. I write about what I build, test, and learn."
  # The home page <title>, Open Graph and Twitter title. Inner pages render "<title> | ChiefGyk3D"; the home page has no suffix, so its full title lives here.
  homeTitle = "ChiefGyk3D | Cybersecurity, Linux, and Open Source"
  # "production" or "staging". Staging adds <meta name="robots" content="noindex,
  # nofollow"> to every page and a robots.txt that disallows everything. A build
  # sets it without editing this file: HUGO_PARAMS_ENVIRONMENT=staging hugo ...
  # The deploy workflow's build job does this while the site lives on test-blog;
  # docs/cutover.md has the steps for the apex.
  environment = "production"

  # Default Open Graph image, a path under static/. Use only a file listed in
  # brand/approved-assets.txt (star-free).
  ogImage = "brand/og-card.png"

  # Identity links, rendered in the footer as <a rel="me"> (Mastodon and
  # similar verify a profile link this way). None until the accounts are set,
  # one table per account:
  #   [[params.me]]
  #     name = "Mastodon"
  #     url = "https://social.example/@name"

  # The site owner as structured data (JSON-LD Person on the home page, author
  # of every Article). The display name only: nothing else about the person goes
  # in the head. sameAs links come from data/socials.yaml.
  # Button frames (docs/borders.md): the level of every button, in this one place.
  # Levels: none (the pre-frame button), minimal (a hairline and four corner ticks,
  # the default and what the site shipped on Nov 8), faithful (the owner's button
  # art). Only buttons are set here; every other element keeps its look.
  # "level" is the default for all buttons; "classes" overrides one button class
  # (btn-primary, btn-ghost, nav-toggle, copy-btn, product-btn, hero-btn), the most specific
  # entry winning. The default: minimal on every button, faithful on the primary
  # button (Read the latest, Start over). The frame is drawn inside the button's
  # own box, so a level never changes a button's size.
  [params.frames]
    level = "minimal"
    [params.frames.classes]
      btn-primary = "faithful"
      # The three Home hero buttons are plain (issue 285): the hero box wears the
      # frame, so its buttons are the none level, no art and no ticks. Read the latest
      # (the primary) is solid amber with dark ink; the two ghost buttons are amber outlines.
      hero-btn = "none"

  [params.author]
    name = "ChiefGyk3D"

# Sitemap: layouts/sitemap.xml writes it (lastmod on every url, no alias stubs,
# no 404). robots.txt names it in production.
[sitemap]
  filename = "sitemap.xml"
