# SPDX-License-Identifier: Apache-2.0
# The project board for this repository, defined as code for Scrum Around and Find Out (SAFO).
# A user-owned GitHub Project: no App can write one, so it is kept current from the maintainer's own
# `gh` login with `safo --board board.yaml reconcile` (no token is stored in CI).
version: 1
project:
  owner: ChiefGyk3D
  owner_type: user
  number: 13
  title: no-php-no-cry
repositories:
  - owner: ChiefGyk3D
    name: no-php-no-cry
    default_area: Site
    area_rules:
      - {match: converter, area: "Content"}
      - {match: wordpress, area: "Content"}
      - {match: scrub, area: "Content"}
      - {match: wxr, area: "Content"}
      - {match: brand, area: "Brand"}
      - {match: token, area: "Brand"}
      - {match: highlight, area: "Brand"}
      - {match: favicon, area: "Brand"}
      - {match: deploy, area: "Deploy"}
      - {match: cloudflare, area: "Deploy"}
      - {match: pages, area: "Deploy"}
      - {match: syndicat, area: "Syndication"}
      - {match: bluesky, area: "Syndication"}
      - {match: mastodon, area: "Syndication"}
      - {match: feed, area: "Syndication"}
      - {match: hardening, area: "Security"}
      - {match: security, area: "Security"}
      - {match: scan, area: "Security"}
fields:
  - name: Status
    type: single_select
    options:
      - {name: Todo, color: GREEN, description: "Stock GitHub default option; use Backlog instead"}
      - {name: Backlog, color: GRAY, description: "Not scheduled"}
      - {name: Next, color: BLUE, description: "Scheduled for a sprint"}
      - {name: In progress, color: YELLOW, description: "Being worked, or a draft pull request"}
      - {name: In review, color: PURPLE, description: "Pull request open, checks and reviews running"}
      - {name: Blocked, color: RED, description: "Needs the maintainer or an outside answer"}
      - {name: Done, color: GREEN, description: "Closed or merged"}
  - name: Area
    type: single_select
    options:
      - {name: Site, color: GRAY, description: "The Hugo site, layouts, SEO and build"}
      - {name: Content, color: BLUE, description: "WordPress export conversion, scrub pass and posts"}
      - {name: Brand, color: PINK, description: "Design tokens, styling and the head"}
      - {name: Deploy, color: ORANGE, description: "Cloudflare Pages staging and production"}
      - {name: Syndication, color: PURPLE, description: "Feeds and posting to social platforms on deploy"}
      - {name: Security, color: RED, description: "Hardening, scans, token and access hygiene"}
      - {name: Docs, color: YELLOW, description: "Docs and README: reading, not building"}
  - name: Size
    type: single_select
    options:
      - {name: S, color: GRAY, description: "About 2 hours"}
      - {name: M, color: BLUE, description: "About 5 hours"}
      - {name: L, color: ORANGE, description: "About 12 hours"}
      - {name: XL, color: RED, description: "About 30 hours: split before scheduling"}
  - name: Kind
    type: single_select
    options:
      - {name: Feature, color: GREEN, description: "New capability in the repository"}
      - {name: Bug, color: RED, description: "Something is wrong"}
      - {name: Decision, color: PURPLE, description: "A ruling, design note or approval"}
      - {name: Research, color: BLUE, description: "A research note or a spike"}
      - {name: Chore, color: GRAY, description: "Upkeep, rotation, dependency bump"}
      - {name: Docs, color: YELLOW, description: "Documentation, including education pages"}
      - {name: Release, color: ORANGE, description: "A tag, a release or a cutover"}
      - {name: Epic, color: PINK, description: "A grouping issue; its work is in sub-issues"}
  - name: Epic
    type: single_select
    options:
      - {name: Static site migration, color: BLUE, description: "Epic #1"}
      - {name: Brand, color: PINK, description: "Epic #2"}
      - {name: Deploy, color: ORANGE, description: "Epic #10"}
      - {name: Syndication, color: PURPLE, description: "Epic #11"}
      - {name: Hardening, color: RED, description: "Epic #27"}
  - {name: Decision, type: text}
  - name: Priority
    type: single_select
    options:
      - {name: P0 now, color: RED, description: "Drop everything"}
      - {name: P1 soon, color: ORANGE, description: ""}
      - {name: P2 later, color: YELLOW, description: ""}
      - {name: P3 someday, color: GRAY, description: ""}
  - name: Agent
    type: single_select
    options:
      - {name: Claude, color: ORANGE, description: "Claude lead or a Claude subagent"}
      - {name: Codex, color: GREEN, description: "OpenAI Codex"}
      - {name: Copilot, color: BLUE, description: "GitHub Copilot coding agent"}
      - {name: You, color: PURPLE, description: "The maintainer"}
      - {name: ChatGPT, color: GREEN, description: "OpenAI ChatGPT: language, copy and prompt wording"}
      - {name: Ollama, color: PINK, description: "Local model on the maintainer's server: triage, summaries, first drafts"}
  - {name: Sprint, type: iteration, start: 2026-10-26, duration_days: 14, count: 8, title_prefix: "S"}
  - {name: Start date, type: date}
  - {name: Target date, type: date}
  - {name: Done on, type: date}
views:
  - {name: All Items, layout: table, filter: ""}
  - {name: Board, layout: board, filter: "-status:Done"}
  - {name: Roadmap, layout: roadmap, filter: "-status:Done"}
  - {name: Sprint, layout: board, filter: "sprint:@current"}
  - {name: Sprint plan, layout: table, filter: "-status:Done"}
  - {name: Epics, layout: table, filter: "kind:Epic"}
  - {name: Bugs, layout: table, filter: "kind:Bug -status:Done"}
  - {name: "Blocked: needs the maintainer", layout: table, filter: "status:Blocked"}
  - {name: By area, layout: table, filter: "-status:Done"}
  - {name: Security, layout: table, filter: 'area:Security -status:Done'}
  - {name: Done log, layout: table, filter: "status:Done"}
rules:
  status:
    opened: Backlog
    opened_pr: In review
    draft_pr: In progress
    reopened: Backlog
    closed: Done
    merged: Done
  done_date_field: Done on
  new_item_defaults:
    Priority: P2 later
agents:
  field: Agent
  working: [In progress, In review, Next]
  waiting: [Blocked]
ui_only:
  - "Board and Sprint views: Column field = Status, Sort by Priority"
  - "Roadmap view: Date fields = Start date and Target date, Group by = Epic, zoom = Quarter"
  - "Sprint plan view: Group by = Sprint; show Size, Agent, Area, Kind"
  - "By area view: Group by = Area"
  - "Project workflows: Item closed -> Done; Pull request merged -> Done; Auto-add is not needed (reconcile adds)"

