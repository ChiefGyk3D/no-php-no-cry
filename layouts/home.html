{{ define "main" }}
<h1>{{ site.Title }}</h1>
{{ .Content }}
<h2>Latest posts</h2>
{{ with where site.RegularPages "Section" "posts" }}
<ul class="post-list">
  {{- range first 5 . }}
  <li><a href="{{ .RelPermalink }}">{{ .Title }}</a> <span class="meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time></span></li>
  {{- end }}
</ul>
<p><a href="{{ "/posts/" | relURL }}">All posts</a></p>
{{ else }}
<p>No posts yet.</p>
{{ end }}
{{ end }}
