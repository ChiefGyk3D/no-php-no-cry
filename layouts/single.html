{{ define "main" }}
<article>
  <h1>{{ .Title }}</h1>
  <div class="meta">
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
    {{- with .GetTerms "tags" }}
    <ul class="tag-list" aria-label="Tags">
      {{- range . }}<li><a href="{{ .RelPermalink }}">#{{ .LinkTitle }}</a></li>{{ end }}
    </ul>
    {{- end }}
  </div>
  {{ .Content }}
</article>
{{ end }}
