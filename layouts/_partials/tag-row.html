{{- /* The "Browse by tag" row: every tag, A to Z, with its count. Shared by the posts archive and the search page. */ -}}
{{- with site.Taxonomies.tags.Alphabetical }}
<nav class="archive-tags" aria-label="Browse by tag">
  <ul class="tag-list">
    {{- range . }}<li><a href="{{ .Page.RelPermalink }}"><span>#{{ .Page.LinkTitle }}</span> <span class="meta tag-count">({{ .Count }})</span></a></li>{{ end }}
  </ul>
</nav>
{{- end }}
