<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a5b0c0"/></marker>
</defs>
<rect width="900" height="1880" fill="#12141a"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17">
<text x="20" y="34" fill="#eceff4" font-size="22" font-weight="bold">1 Publishing path</text>
<rect x="20" y="70" width="860" height="170" rx="10" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="10 6"/>
<text x="32" y="92" fill="#fbbf24" font-weight="bold">TB1 Owner machine and accounts (trusted operator)</text>
<rect x="20" y="320" width="860" height="590" rx="10" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="10 6"/>
<text x="32" y="342" fill="#fbbf24" font-weight="bold">TB2 GitHub (public repository, untrusted input)</text>
<rect x="20" y="1180" width="860" height="170" rx="10" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="10 6"/>
<text x="32" y="1202" fill="#fbbf24" font-weight="bold">TB3 Deploy job (the only credential holder)</text>
<rect x="20" y="1430" width="860" height="170" rx="10" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="10 6"/>
<text x="32" y="1452" fill="#fbbf24" font-weight="bold">TB4 Cloudflare (third-party operated)</text>
<rect x="20" y="1680" width="860" height="170" rx="10" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="10 6"/>
<text x="32" y="1702" fill="#fbbf24" font-weight="bold">TB5 Social platforms (third-party operated)</text>
<path d="M350 145 L550 145" fill="none" stroke="#a5b0c0" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M350 185 L485 185 L485 395 L350 395" fill="none" stroke="#a5b0c0" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M605 210 L605 370" fill="none" stroke="#a5b0c0" stroke-width="2" marker-end="url(#arrow)"/>
