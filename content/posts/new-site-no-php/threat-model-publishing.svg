<text x="445" y="1394" fill="#eceff4" text-anchor="middle">Publish folder with API</text>
<text x="445" y="1415" fill="#eceff4" text-anchor="middle">token</text>
<rect x="302.6" y="700.8" width="144.9" height="48" rx="4" fill="#12141a"/>
<text x="375" y="718.8" fill="#eceff4" text-anchor="middle">New post with</text>
