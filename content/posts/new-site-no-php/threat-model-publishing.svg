<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 723" width="1200" height="723" role="img" aria-labelledby="t d">
<title id="t">1 Publishing path</title>
<desc id="d">Data flow diagram with 5 trust boundaries (dashed boxes): TB1 Owner machine and accounts (trusted operator); TB2 GitHub (public repository, untrusted input); TB3 Deploy job (the only credential holder); TB4 Cloudflare (third-party operated); TB5 Social platforms (third-party operated). Elements: Owner (trusted operator); Contributor via pull request; Supply chain (actions, dependencies, Hugo, fonts); Local editor and author helper; GitHub web editor; Repository and pull request review; Git history and content; CI build and checks (no credentials); Deploy job (credentialed); Syndication job (planned, issue 11); Social platforms (Bluesky, Mastodon, Discord, Matrix); Cloudflare Pages (published site). Flows: Owner (trusted operator) to Local editor and author helper, Author files; Owner (trusted operator) to GitHub web editor, Edit in browser; Local editor and author helper to Repository and pull request review, git push, pull request; GitHub web editor to Repository and pull request review, Commit from web editor; Contributor via pull request to Repository and pull request review, Pull request from a fork; Repository and pull request review to Git history and content, Merge to main; Repository and pull request review to CI build and checks (no credentials), Run checks; Supply chain (actions, dependencies, Hugo, fonts) to CI build and checks (no credentials), Actions, packages, Hugo, fonts; CI build and checks (no credentials) to Deploy job (credentialed), Build artifact after CI green; Deploy job (credentialed) to Cloudflare Pages (published site), Publish folder with API token; Git history and content to Syndication job (planned, issue 11), New post with syndicate true; Syndication job (planned, issue 11) to Social platforms (Bluesky, Mastodon, Discord, Matrix), Announce once.</desc>
