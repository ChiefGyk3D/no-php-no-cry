<path d="M605 460 L605 580" fill="none" stroke="#a5b0c0" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M605 1000 L605 670" fill="none" stroke="#a5b0c0" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M800 645 L825 645 L825 1255 L570 1255" fill="none" stroke="#a5b0c0" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M445 1320 L445 1480" fill="none" stroke="#a5b0c0" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M350 645 L375 645 L375 790" fill="none" stroke="#a5b0c0" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M515 880 L515 1205 L595 1205 L595 1755 L570 1755" fill="none" stroke="#a5b0c0" stroke-width="2" marker-end="url(#arrow)"/>
