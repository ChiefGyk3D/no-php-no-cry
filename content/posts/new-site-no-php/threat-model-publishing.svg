<text x="445" y="1281" fill="#eceff4" text-anchor="middle">Deploy job (credentialed)</text>
<rect x="320" y="1480" width="250" height="90" rx="22" fill="#1e232d" stroke="#7fe0a8" stroke-width="2"/>
<text x="445" y="1520.5" fill="#eceff4" text-anchor="middle">Cloudflare Pages</text>
<text x="445" y="1541.5" fill="#eceff4" text-anchor="middle">(published site)</text>
<rect x="320" y="1730" width="250" height="90" fill="#1e232d" stroke="#8fb4ff" stroke-width="2"/>
<text x="445" y="1760" fill="#eceff4" text-anchor="middle">Social platforms</text>
<text x="445" y="1781" fill="#eceff4" text-anchor="middle">(Bluesky, Mastodon,</text>
<text x="445" y="1802" fill="#eceff4" text-anchor="middle">Discord, Matrix)</text>
<rect x="386.9" y="131.5" width="126.2" height="27" rx="4" fill="#12141a"/>
<text x="450" y="149.5" fill="#eceff4" text-anchor="middle">Author files</text>
<rect x="407.9" y="276.5" width="154.2" height="27" rx="4" fill="#12141a"/>
<text x="485" y="294.5" fill="#eceff4" text-anchor="middle">Edit in browser</text>
<rect x="495.1" y="244.5" width="219.7" height="27" rx="4" fill="#12141a"/>
<text x="605" y="262.5" fill="#eceff4" text-anchor="middle">git push, pull request</text>
<rect x="372.9" y="391" width="154.2" height="48" rx="4" fill="#12141a"/>
<text x="450" y="409" fill="#eceff4" text-anchor="middle">Commit from web</text>
<text x="450" y="430" fill="#eceff4" text-anchor="middle">editor</text>
