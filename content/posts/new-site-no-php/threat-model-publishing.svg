<text x="675" y="620.5" fill="#eceff4" text-anchor="middle">CI build and checks (no</text>
<text x="675" y="641.5" fill="#eceff4" text-anchor="middle">credentials)</text>
<rect x="320" y="790" width="250" height="90" rx="22" fill="#1e232d" stroke="#7fe0a8" stroke-width="2"/>
<text x="445" y="830.5" fill="#eceff4" text-anchor="middle">Syndication job (planned,</text>
<text x="445" y="851.5" fill="#eceff4" text-anchor="middle">issue 11)</text>
