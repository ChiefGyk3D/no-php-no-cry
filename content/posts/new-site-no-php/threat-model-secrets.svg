<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 569" width="1200" height="569" role="img" aria-labelledby="t d">
<title id="t">3 Data stores and secrets</title>
<desc id="d">Data flow diagram with 3 trust boundaries (dashed boxes): TB10 Doppler (secret store); TB11 GitHub Actions (build and deploy); TB12 Cloudflare account. Elements: Owner (sets and rotates secrets); Contributor via fork pull request; Doppler (product project, dev environment config); Doppler OIDC identity (main only); GitHub Actions secrets and variables; Deploy job; Cloudflare API token and account id; Cloudflare account (Pages, database); Analytics hash secret (planned); Public repository; Analytics database maintenance job (planned). Flows: Deploy job to Doppler OIDC identity (main only), GitHub OIDC token; Doppler OIDC identity (main only) to Deploy job, Two Cloudflare values; Doppler (product project, dev environment config) to Doppler OIDC identity (main only), Identity lookup; Deploy job to Cloudflare account (Pages, database), Publish with token; GitHub Actions secrets and variables to Deploy job, Fallback read (policy: empty); Cloudflare API token and account id to Deploy job, Token value; Contributor via fork pull request to Public repository, Pull request (no secrets); Owner (sets and rotates secrets) to Doppler (product project, dev environment config), Set and rotate (owner only); Analytics hash secret (planned) to Analytics database maintenance job (planned), Key for the daily code.</desc>
