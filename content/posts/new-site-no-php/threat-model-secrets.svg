<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1380" width="900" height="1380" role="img" aria-labelledby="t d">
<title id="t">3 Data stores and secrets</title>
<desc id="d">Data flow diagram with 3 trust boundaries (dashed boxes): TB11 GitHub Actions (build and deploy); TB10 Doppler (secret store); TB12 Cloudflare account. Elements: Deploy job; GitHub Actions secrets and variables; Public repository; Analytics database maintenance job (planned); Doppler OIDC identity (main only); Doppler (product project, dev environment config); Analytics hash secret (planned); Cloudflare account (Pages, database); Hosting deployment credentials; Contributor via fork pull request; Owner (sets and rotates secrets). Flows: Deploy job to Doppler OIDC identity (main only), Workload identity credential; Doppler OIDC identity (main only) to Deploy job, Deployment credential values; Doppler (product project, dev environment config) to Doppler OIDC identity (main only), Identity lookup; Deploy job to Cloudflare account (Pages, database), Publish with deployment credential; GitHub Actions secrets and variables to Deploy job, Fallback read (policy: empty); Hosting deployment credentials to Deploy job, Token value; Contributor via fork pull request to Public repository, Pull request (no secrets); Owner (sets and rotates secrets) to Doppler (product project, dev environment config), Set and rotate (owner only); Analytics hash secret (planned) to Analytics database maintenance job (planned), Key for the daily code.</desc>
