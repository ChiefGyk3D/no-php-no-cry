<text x="545" y="282.5" fill="#eceff4" text-anchor="middle">HTML, CSS, pinned</text>
<text x="545" y="303.5" fill="#eceff4" text-anchor="middle">scripts</text>
<rect x="445.5" y="791.5" width="229.1" height="27" rx="4" fill="#12141a"/>
<text x="560" y="809.5" fill="#eceff4" text-anchor="middle">Follow an external link</text>
<rect x="382.2" y="141" width="135.6" height="48" rx="4" fill="#12141a"/>
<text x="450" y="159" fill="#eceff4" text-anchor="middle">Click a share</text>
<text x="450" y="180" fill="#eceff4" text-anchor="middle">button</text>
<rect x="370.5" y="921" width="173" height="48" rx="4" fill="#12141a"/>
<text x="457" y="939" fill="#eceff4" text-anchor="middle">Open share URL in</text>
<text x="457" y="960" fill="#eceff4" text-anchor="middle">a new window</text>
<rect x="377.6" y="411" width="144.9" height="48" rx="4" fill="#12141a"/>
<text x="450" y="429" fill="#eceff4" text-anchor="middle">Invoke on HTML</text>
<text x="450" y="450" fill="#eceff4" text-anchor="middle">routes</text>
<rect x="490.5" y="483.5" width="229.1" height="48" rx="4" fill="#12141a"/>
<text x="605" y="501.5" fill="#eceff4" text-anchor="middle">Insert one row, bounded</text>
<text x="605" y="522.5" fill="#eceff4" text-anchor="middle">by a timer</text>
<rect x="269.8" y="503" width="210.4" height="48" rx="4" fill="#12141a"/>
<text x="375" y="521" fill="#eceff4" text-anchor="middle">Beacon reports to the</text>
