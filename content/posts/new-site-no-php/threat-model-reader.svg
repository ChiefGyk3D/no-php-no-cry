<path d="M350 165 L550 165" fill="none" stroke="#a5b0c0" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M800 185 L835 185 L835 945 L295 945 L295 920" fill="none" stroke="#a5b0c0" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M350 435 L550 435" fill="none" stroke="#a5b0c0" stroke-width="2" marker-end="url(#arrow)"/>
