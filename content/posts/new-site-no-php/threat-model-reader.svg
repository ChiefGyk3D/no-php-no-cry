<text x="225" y="860" fill="#eceff4" text-anchor="middle">Other sites (link</text>
<text x="225" y="881" fill="#eceff4" text-anchor="middle">targets, share targets, a</text>
<text x="225" y="902" fill="#eceff4" text-anchor="middle">Mastodon server)</text>
<rect x="550" y="830" width="250" height="90" rx="22" fill="#1e232d" stroke="#7fe0a8" stroke-width="2"/>
<text x="675" y="870.5" fill="#eceff4" text-anchor="middle">Third-party embeds (none</text>
<text x="675" y="891.5" fill="#eceff4" text-anchor="middle">shipped)</text>
