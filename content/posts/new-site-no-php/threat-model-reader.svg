<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 816" width="1200" height="816" role="img" aria-labelledby="t d">
<title id="t">2 Reader path</title>
<desc id="d">Data flow diagram with 4 trust boundaries (dashed boxes): TB6 Visitor browser (untrusted input); TB7 Cloudflare edge and Pages (third-party operated); TB8 Other people's sites; TB9 Release of reports (owner to readers). Elements: Public visitor; Share panel and instance picker (/share.js); Cloudflare edge and Pages static assets; Analytics Pages Function (planned); Cloudflare Web Analytics beacon; Analytics database (planned); Report job (owner runs, aggregates only); Reader of released reports; Other sites (link targets, share targets, a Mastodon server); Third-party embeds (none shipped). Flows: Public visitor to Cloudflare edge and Pages static assets, HTTPS GET page; Cloudflare edge and Pages static assets to Public visitor, HTML, CSS, pinned scripts; Public visitor to Other sites (link targets, share targets, a Mastodon server), Follow an external link; Public visitor to Share panel and instance picker (/share.js), Click a share button; Share panel and instance picker (/share.js) to Other sites (link targets, share targets, a Mastodon server), Open share URL in a new window; Cloudflare edge and Pages static assets to Analytics Pages Function (planned), Invoke on HTML routes; Analytics Pages Function (planned) to Analytics database (planned), Insert one row, bounded by a timer; Cloudflare Web Analytics beacon to Cloudflare edge and Pages static assets, Beacon reports to the site; Analytics database (planned) to Report job (owner runs, aggregates only), Read report views; Report job (owner runs, aggregates only) to Reader of released reports, Released aggregate report.</desc>
