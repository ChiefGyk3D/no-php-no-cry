<text x="32" y="92" fill="#fbbf24" font-weight="bold">TB6 Visitor browser (untrusted input)</text>
<rect x="20" y="320" width="860" height="380" rx="10" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="10 6"/>
<text x="32" y="342" fill="#fbbf24" font-weight="bold">TB7 Cloudflare edge and Pages (third-party operated)</text>
<rect x="20" y="780" width="860" height="170" rx="10" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="10 6"/>
<text x="32" y="802" fill="#fbbf24" font-weight="bold">TB8 Other people's sites</text>
<rect x="20" y="1030" width="860" height="170" rx="10" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="10 6"/>
<text x="32" y="1052" fill="#fbbf24" font-weight="bold">TB9 Release of reports (owner to readers)</text>
