# Social networks: the /social/ tile grid, the footer icon row (and later the
# home strip). One entry per network, display order. Keys:
#   name    network name
#   icon    slug: static/brand/icons/<slug>.svg and .social-icon--<slug> in
#           assets/css/pages/social.css. Empty for a network with no icon yet.
#   url     https only. Empty means "not live": the tile is not a link and the
#           footer row skips it.
#   handle  public handle or room name
#   rel_me  true renders rel="me" (identity verification: Mastodon and GitHub
#           read it). Leave false where the network has no such mechanism.
#   fediverse_creator  optional, "@user@host": rendered as <meta name="fediverse:creator">
#           on posts and journal entries only (Mastodon author attribution, link
#           preview credit). The author also lists this site's domain under
#           Preferences > Public profile > Verification > Author attribution.
#   blurb   the short role line
#   footer_only  true (issue 195) means the entry is a footer icon only: it is
#           skipped by the /social/ tiles, the Home "Find me online" chips, the
#           rel=me head links, the schema.org sameAs list and llms.txt, and the
#           footer renders it with rel="noopener" only. Keep footer_only entries
#           last: the footer row is the other live entries, then these.
# Every URL below is already published by the maintainer: the GitHub profile
# README, the old WordPress Social Media Links page, or the links page (Threads:
# also brand/outro.json in the brand kit). None is guessed.
- name: Twitch
  icon: twitch
  url: https://twitch.tv/chiefgyk3d
  handle: chiefgyk3d
  rel_me: false
  blurb: Live streams
