# Social networks: the /social/ tile grid, the footer icon row (and later the
# home strip). One entry per network, display order. Keys:
#   name    network name
#   icon    slug: static/brand/icons/<slug>.svg and .social-icon--<slug> in
#           assets/css/pages/social.css. Empty for a network with no icon yet.
#   url     https only. Empty means "not live": the tile is not a link and the
#           footer row skips it.
#   handle  public handle or room name
#   rel_me  true renders rel="me" (identity verification: Mastodon and GitHub
#           read it). Leave false where the network has no such mechanism.
#   blurb   the short role line
# Every URL below is already published by the maintainer: the GitHub profile
# README, the old WordPress Social Media Links page, or the links page (Threads:
# also brand/outro.json in the brand kit). None is guessed.
- name: Twitch
