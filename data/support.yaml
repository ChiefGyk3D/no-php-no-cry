# Support data. Order is display order. Two kinds of entry share this file:
#
# Links (the footer Support row and the buttons on /support/): name, url (https
# only), button (the label on /support/, when different from the footer name),
# blurb (the short line under it on /support/).
# Each link is rechecked before publish.
#
# Cryptocurrency (the /support/ cryptocurrency block): kind: cryptocurrency, name,
# ticker, coin (btc, xmr, eth or sol; names static/support/qr-<coin>.svg and
# static/support/coin-<coin>.svg, the mark drawn in the middle of the QR code),
# address, and an empty url so the footer, which lists only https urls, skips it.
# The short form of the word never appears anywhere in the repository;
# scripts/check-wording.sh enforces that (brand/README.md, Wording).
# Addresses are copied verbatim from the authoritative source, the public repo
# github.com/ChiefGyk3D/support-me (SIGNATURE.md, read 2026-11-04). When an
# address changes there, change it here, run scripts/gen-support-qr.sh and
# update scripts/test-pages.sh in the same pull request.
