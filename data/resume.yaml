# Codex draft (owner-reviewed, issue 262),.
site_proof:
  heading: This site is the proof
  text: "I built this site on Cloudflare Pages, and the security headers include a strict CSP with hashed scripts pinned by SHA-256. The build checks and post-deploy smoke test verify the served script hashes; that smoke test caught a Cloudflare rewrite that injected a script. Fingerprinted assets use immutable caching, and build checks fail when page budgets are exceeded, including the 150 KB page budget. Locally, Lighthouse scores 100 on every indexable page type."

