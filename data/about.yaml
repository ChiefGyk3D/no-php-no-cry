# Skills section: each group is an h3 with its text under it, in this order.
skills_heading: "Skills"
skills:
  - name: "Identity and access"
    text: "I work with single sign-on, MFA, passwordless authentication, passkeys, hardware security keys, identity-driven access controls, LDAP integration, and service authentication. Okta, Microsoft Entra, JumpCloud, YubiKey, Delinea."
  - name: "Endpoint, email, and data security"
    text: "I work across endpoint detection and response, email security, phishing response, data access visibility, and security platform automation. CrowdStrike, Proofpoint TRAP, Avanan, Varonis."
  - name: "Network security and zero trust"
    text: "I handle firewall administration, network segmentation, VLAN design and isolation, intrusion detection and prevention, DNS filtering, remote access architecture, network telemetry, and troubleshooting. Zscaler ZIA and ZPA, Twingate, pfSense CE and pfSense Plus, Suricata, pfBlockerNG, UniFi, MikroTik."
  - name: "Security operations and investigation"
    text: "My work includes log collection, forwarding, and analysis, security telemetry, detection, vulnerability management, honeypots and deception, and attack surface analysis. Splunk, Wazuh, OpenSearch, Datadog, Tenable, Wiz, VirusTotal, urlscan, OWASP Threat Dragon."
  - name: "Cloud, infrastructure as code, and secrets"
    text: "I build automated infrastructure, manage secrets, design zero-trust access for cloud environments, and create reproducible security labs and educational infrastructure. AWS, DigitalOcean, Terraform, OpenTofu, Spacelift, Doppler, GitHub, Cloudflare."
  - name: "Linux and homelab"
    text: "In my homelab, I administer Pop!_OS, Ubuntu, Debian, and Parrot OS systems, run virtualized infrastructure with Proxmox, repurpose hardware for services, and perform serial-console installations. I self-host Mastodon, Matrix, and Pixelfed, including Matrix-Discord bridging."
  - name: "Software and automation"
    text: "I develop Python tools and open-source libraries, build API integrations and event-driven bots, connect notification and messaging systems, and use GitHub-based development and code review. My CI work includes security checks, dependency scanning, and linting. GitHub, GitHub Copilot, Snyk, Discord and Matrix integrations, streaming and social-platform integrations."
  - name: "Local AI and agents"
    text: "I run local models through Ollama on a dual-GPU server and route work between local and hosted models based on cost and capability. I coordinate agents for drafting, implementation, and review, require human approval for paid model use, and use AI-assisted review alongside conventional CI and security checks."
  - name: "Radio, RF, and telecom"
    text: "I work with SDR, Meshtastic, LoRa, APRS and packet radio, RF experimentation, cellular modem integration, and telecom security. HackRF, Meshtastic devices, LoRa radios, and Linux-based radio and SDR tooling."
  - name: "Where I'm headed"
    text: "I am a Senior Cybersecurity Engineer with a CISSP, primarily self-taught through homelabbing and hands-on work. I am moving toward a security architecture role."
