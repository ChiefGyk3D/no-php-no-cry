# The mission paragraph (owner-approved wording, verbatim): rendered right after
# the bio and the speaking sentence, before the projects and Contact.
mission: "I make cybersecurity knowledge available to more than 500K followers across all platforms, with one goal: breaking down the barriers around who gets to learn it. Knowledge is power, money is power, and leaving knowledge behind a price tag means power stays with the people who already have money. I have an ethical issue with that, so I open source a lot of my work. You're not dead until you stop learning. Happy Hacking."
# Skills section: each group is an h3 with its text under it, in this order.
skills_heading: "Skills"
skills:
  - name: "Identity and access"
    text: "IAM, single sign-on and MFA, passwordless authentication with passkeys and hardware security keys, identity-driven access controls, LDAP integration and service authentication. Okta, Microsoft Entra, JumpCloud, YubiKey, Delinea."
  - name: "Endpoint, email, and data security"
    text: "EDR, email security and phishing response, data security and access visibility, and wiring security platforms together with automation. CrowdStrike, Proofpoint TRAP, Avanan, Varonis."
  - name: "Network security and zero trust"
    text: "ZTNA and SASE, firewall administration and segmentation, VLAN design and isolation, intrusion detection and prevention, DNS filtering, remote access architecture, network telemetry and troubleshooting, and telecom security. Zscaler ZIA and ZPA, Twingate, pfSense CE and Plus, Suricata, pfBlockerNG, UniFi, MikroTik."
  - name: "Security operations and investigation"
    text: "SIEM and SOC work, SOAR, log collection and analysis, security telemetry, threat modeling, OSINT, vulnerability management, honeypots and deception, attack surface analysis. Splunk, Wazuh, OpenSearch, Datadog, Tenable, Wiz, VirusTotal, urlscan, OWASP Threat Dragon."
  - name: "Cloud, infrastructure as code, and secrets"
    text: "Cloud security, infrastructure as code, automated provisioning, secrets management, zero trust access for cloud environments, and reproducible security labs for teaching. AWS, DigitalOcean, Terraform, OpenTofu, Spacelift, Doppler, GitHub, Cloudflare."
  - name: "Linux and homelab"
    text: "Linux desktop and server administration (Pop!_OS, Ubuntu, Debian, Parrot OS), a production-style homelab built partly from repurposed hardware, virtualization with Proxmox, serial-console installs, and self-hosted Mastodon, Matrix, and Pixelfed, with Matrix and Discord bridging. This is homelab work, separate from my professional work."
  - name: "Software and automation"
    text: "Python, open-source tooling and libraries, API integrations, event-driven bots, cross-platform notification systems, GitHub-based development and code review, CI security checks, dependency scanning, and linting. GitHub, GitHub Copilot, Snyk, Discord and Matrix integrations, streaming and social platform integrations."
  - name: "Local AI and agents"
    text: "I run a dual-GPU local AI server with Ollama, build workflows that combine local and hosted models (Claude, ChatGPT, Gemini, Copilot), route tasks by cost and capability, coordinate agents for drafting, implementation, and review, put human approval gates on paid model use, and run AI-assisted review next to normal CI and security checks. This is engineering and integration work, not model training or research."
  - name: "Radio, RF, and telecom"
    text: "Licensed amateur radio operator. SDR, Meshtastic, LoRa, APRS and packet radio, RF experimentation, cellular modem integration, telecom security. HackRF, Meshtastic devices, LoRa radios, Linux-based SDR tooling."
