  - name: "Radio"
    text: "Licensed amateur radio operator. SDR, Meshtastic, LoRa, antenna builds, and a growing toolchain for turning a Linux box into an RF workstation."
  - name: "Self-hosted"
    text: "My own Mastodon instance, Matrix homeserver, Pixelfed, link aggregator, support page, and more."
