# About page bio (owner-approved wording). Edit the text here; the template
# layouts/about/single.html only renders it. Keep it verbatim unless the owner
# changes it. "opener" is the intro line under the page heading; "paragraphs"
# are the body, in order.
opener: "Hi, I'm Moshe, and I go by ChiefGyk3D online."
paragraphs:
  - "I’m a Senior Cybersecurity Engineer (CISSP), Linux nerd, open-source builder, and content creator. I’m primarily self-taught through homelabbing, curiosity, and hands-on work. My work covers IAM, EDR, SOAR, ZTNA, SASE, cloud security, threat modeling, OSINT, telecom security, and SIEM/SOC work. I run Linux on desktops and servers and work with pfSense, Suricata, Wazuh, and OpenSearch."
  - "My production-style homelab includes repurposed hardware, a dual-GPU local AI box, and self-hosted Mastodon, Matrix, and Pixelfed. I’m also a licensed ham radio operator working with SDR, Meshtastic, and LoRa. I care about end-to-end encryption, zero trust, owning my infrastructure, right to repair, and privacy rights. I’m more than ready for a security architecture role, and that’s where I’m headed."
# The speaking sentence: before + link text + after. The link renders only
# while url is set (https only).
speaking:
  before: "In 2026 I spoke at BSides Dayton and COISSA. I'm a member of DEFCON 614 and I'm with the "
  link_text: "Call Center Village"
  url: "https://www.callcentervillage.com/"
  after: ", where I volunteer."
# The mission paragraph (owner-approved wording, verbatim): rendered right after
# the bio and the speaking sentence, before the projects and Contact.
mission: "I make cybersecurity knowledge available to more than 500K followers across all platforms, with one goal: breaking down the barriers around who gets to learn it. Knowledge is power, money is power, and leaving knowledge behind a price tag means power stays with the people who already have money. I have an ethical issue with that, so I open source a lot of my work. You're not dead until you stop learning. Happy Hacking."
