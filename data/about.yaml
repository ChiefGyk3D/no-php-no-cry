homelab_heading: "Hardware and homelab"
homelab_intro: "A production-grade home lab for building, breaking, and learning. I use single-board computers and repurposed hardware wherever practical."
homelab:
  - name: "Network and security"
    text: "A Supermicro E300-8D firewall running pfSense, Suricata IDS/IPS, and pfBlockerNG on VLAN-segmented networks. UniFi managed switches and access points send telemetry into Grafana and InfluxDB through UniFi Poller, and device logs go to Wazuh for EDR alerting."
  - name: "SIEM server"
    text: "A Supermicro SuperServer 5019A-FTN4 with an Intel Atom C3758 and 64 GB of DDR4 ECC, on tiered SSD and NVMe storage. It runs a Dockerized OpenSearch hot/warm cluster with Wazuh, Grafana, Logstash, Prometheus, InfluxDB, Syslog-ng, UniFi Poller, and Portainer."
    links:
      - name: "siem-docker-stack"
        url: "https://github.com/ChiefGyk3D/siem-docker-stack"
      - name: "pfsense-siem-stack"
        url: "https://github.com/ChiefGyk3D/pfsense-siem-stack"
  - name: "AI inference"
    text: "The FrankenLLM server runs two GPUs, an NVIDIA RTX 5060 Ti 16 GB and an NVIDIA RTX 3050 8 GB, for simultaneous multi-model inference."
    links:
      - name: "FrankenLLM"
        url: "https://github.com/ChiefGyk3D/FrankenLLM"
  - name: "Compute and storage"
    text: "Raspberry Pi 4 and 5, Pine64, and other single-board computers for power-efficient computing. Second-hand PCs repurposed whenever possible to reduce e-waste. A Synology NAS with NUT (Network UPS Tools) monitoring and notifications."
  - name: "Radio, SDR, and time"
    text: "Meshtastic nodes, LoRa experiments, and custom antenna builds. SDR for ADS-B aircraft tracking, UAT weather, and RF signal analysis. Hammunition builds the workstation, and Hammunition Hill watches propagation from it. In progress: two GPS-disciplined stratum-1 NTP appliances built from Mother Ticker."
    links:
      - name: "Hammunition"
        url: "https://github.com/Renegade-Penguin/Hammunition"
      - name: "Hammunition Hill"
        url: "https://github.com/Renegade-Penguin/hammunition-hill"
      - name: "Mother Ticker"
        url: "https://github.com/ChiefGyk3D/mother-ticker"
  - name: "Cloud extension"
    text: "Clouds Against Humanity: DigitalOcean droplets managed with OpenTofu through Spacelift, secrets in Doppler, and reachable only over Twingate zero-trust access with zero public inbound ports."
    links:
      - name: "Clouds Against Humanity"
        url: "https://github.com/ChiefGyk3D/Clouds-Against-Humanity"
