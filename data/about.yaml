# About page bio (owner-approved wording). Edit the text here; the template
# layouts/about/single.html only renders it. Keep it verbatim unless the owner
# changes it. "opener" is the intro line under the page heading; "paragraphs"
# are the body, in order.
opener: "Hi, I'm Moshe, and I go by ChiefGyk3D online."
paragraphs:
  - "I’m a Senior Cybersecurity Engineer (CISSP), Linux nerd, ham radio operator, open-source builder, and content creator. I’m primarily self-taught. Most of what I know came from curiosity, building things in my homelab, and figuring out why they didn’t work."
  - "My work spans identity and access management, endpoint security, security automation, zero trust, and cloud and network security. I also work with threat modeling, OSINT, telecom security, and SIEM/SOC tooling. That includes IAM, EDR, SOAR, ZTNA, and SASE, along with tools like pfSense, Suricata, Wazuh, and OpenSearch. I’m more than ready for a security architecture role, and that’s where I’m headed."
  - "I run Linux on my desktops and servers, and my homelab is where a lot of my interests come together. It’s a production-style environment built partly from repurposed hardware, with a dual-GPU local AI box and self-hosted services including Mastodon, Matrix, and Pixelfed. Radio is part of that curiosity too, from software-defined radio to Meshtastic and LoRa. I care about end-to-end encryption, zero trust, owning my infrastructure, right to repair, and privacy rights."
# The speaking sentence: before + link text + after. The link renders only
# while url is set (https only).
speaking:
  before: "In 2026, I spoke at BSides Dayton and COISSA. I also volunteer with the "
  link_text: "Call Center Village"
  url: "https://www.callcentervillage.com/"
  after: "."
# The mission paragraph (owner-approved wording, verbatim): rendered right after
# the bio and the speaking sentence, before the projects and Contact.
mission: "I share cybersecurity knowledge with more than 500K followers across platforms because I want more people to have access to it. Knowledge is power. Money is power. When you put knowledge behind a price tag, you help keep that power with the people who already have money. I have an ethical issue with that, so I open source a lot of my work and share what I learn."
# Two paragraphs after the mission paragraph (owner-approved wording, verbatim, issue 264): why the site is
# built this way, then the creator paragraph. Order: mission, built, creator, closing.
built: "PHP2Shell made me take another look at how I build for the web, and I wanted a site that was fast, light, and more secure, with a minimal attack surface. So I built it as a static site on Cloudflare Pages, with strict security headers and a small set of pinned scripts. The same drive shows up in my homelab and public repos, where I build and document the systems I want to understand. If I put this much work into my own homelab, you can probably guess what I bring when I work with you."
creator: "I am a content creator with over 500,000 followers across platforms, a Kick partner and a Twitch partner, and I work directly with TikTok in their educators program. I make tutorials, security breakdowns, and livestreams about Linux as a daily driver and production environment, cybersecurity investigations, and real-world threat and news breakdowns. I also cover radio and Meshtastic communications, mesh networking, endpoint security, enterprise tooling, home labs, and networking architecture. My content also includes device reviews, privacy tools, and open-source infrastructure."
# The closing line (owner-approved wording, verbatim), after the mission paragraph.
closing: "You’re not dead until you stop learning. Happy hacking."
